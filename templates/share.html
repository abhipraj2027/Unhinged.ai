<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script>
// Dynamic OG tags from URL params
var p = new URLSearchParams(window.location.search);
var s = parseFloat(p.get("score")) || 5;
var r = p.get("roast") || "";
var k = p.get("risk") || "";
document.title = "I scored " + s.toFixed(1) + "/10 on UnHinged 🔥";
</script>
<meta property="og:title" content="I scored on the UnHinged email scale 🔥">
<meta property="og:description" content="AI scores your emails 1-10 on the unhinged scale, roasts you, then rewrites them professionally.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://unhinged.email/share">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0A0A;color:#fff;font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px}
a{color:#FF5C00;text-decoration:none}
h1{font-size:20px;font-weight:900;margin:16px 0 4px;text-align:center}
.subtitle{font-size:13px;color:#71717A;text-align:center;margin-bottom:20px}
.card-img{max-width:600px;width:100%;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.06)}
.actions{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{padding:12px 20px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:8px;transition:transform .12s;text-decoration:none}
.btn:hover{transform:translateY(-2px)}
.btn.tw{background:#000;color:#fff;border:1px solid #333}
.btn.li{background:#0A66C2;color:#fff}
.btn.wa{background:#25D366;color:#fff}
.btn.dl{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.15)}
.btn.cta{background:linear-gradient(135deg,#FF5C00,#FF3B30);color:#000;font-weight:800;padding:14px 28px;font-size:15px}
.divider{margin:20px 0;font-size:12px;color:#3F3F46}
.loading{padding:40px;text-align:center;color:#52525B}
</style>
</head>
<body>

<h1>🔥 My UnHinged Score</h1>
<div class="subtitle">How unhinged is YOUR email?</div>

<div class="loading" id="loadState">Generating your roast card...</div>
<img class="card-img" id="cardImg" style="display:none" alt="UnHinged Roast Card">

<div class="actions" id="actions" style="display:none">
  <button class="btn dl" onclick="downloadCard()">⬇ Save Image</button>
  <button class="btn tw" onclick="shareTwitter()">𝕏 Post on X</button>
  <button class="btn wa" onclick="shareWhatsApp()">💬 WhatsApp</button>
  <button class="btn li" onclick="shareLinkedIn()">in LinkedIn</button>
</div>

<div class="divider">— or —</div>

<a href="/" class="btn cta">🔥 Roast YOUR email — free</a>

<script>
var params = new URLSearchParams(window.location.search);
var score = parseFloat(params.get("score")) || 5.0;
var roast = params.get("roast") || "This email needs more chaos.";
var risk = params.get("risk") || "";

// Generate card image from server
var imgUrl = "/api/share-image?score=" + score + "&roast=" + encodeURIComponent(roast) + "&risk=" + encodeURIComponent(risk);
var img = document.getElementById("cardImg");

img.onload = function() {
  document.getElementById("loadState").style.display = "none";
  img.style.display = "block";
  document.getElementById("actions").style.display = "flex";
};
img.onerror = function() {
  document.getElementById("loadState").textContent = "Card generation failed. Try refreshing.";
};
img.src = imgUrl;

// Update OG image dynamically (for crawlers that execute JS)
var ogImg = document.createElement("meta");
ogImg.setAttribute("property", "og:image");
ogImg.setAttribute("content", window.location.origin + imgUrl);
document.head.appendChild(ogImg);

function downloadCard() {
  var a = document.createElement("a");
  a.href = imgUrl;
  a.download = "unhinged-score-" + score.toFixed(1) + ".png";
  a.click();
}

function shareTwitter() {
  var text = "I scored " + score.toFixed(1) + "/10 on the UnHinged email scale 🔥\n\n\"" + roast.substring(0, 120) + "...\"\n\nHow unhinged is YOUR email? Try free →";
  window.open("https://twitter.com/intent/tweet?text=" + encodeURIComponent(text) + "&url=" + encodeURIComponent("https://unhinged.email"), "_blank");
}

function shareWhatsApp() {
  var text = "I scored " + score.toFixed(1) + "/10 on UnHinged 🔥\n\n\"" + roast.substring(0, 120) + "...\"\n\nRoast YOUR email free → https://unhinged.email";
  window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
}

function shareLinkedIn() {
  window.open("https://www.linkedin.com/sharing/share-offsite/?url=" + encodeURIComponent(window.location.href), "_blank");
}
</script>
</body>
</html>
