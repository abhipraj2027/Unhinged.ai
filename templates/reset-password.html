<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UnHinged — Reset Password</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0A0A;color:#fff;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{max-width:400px;width:100%;margin:20px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:32px 28px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;top:0;left:40px;right:40px;height:2px;background:linear-gradient(90deg,transparent,#FF5C00,transparent);opacity:.5}
.logo{text-align:center;margin-bottom:24px}
.logo span{font-size:32px}
.logo h1{font-size:20px;font-weight:900;margin-top:8px}
.logo p{font-size:13px;color:#71717A;margin-top:4px}
label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#71717A;margin-bottom:6px;margin-top:14px;font-family:'JetBrains Mono',monospace}
input{width:100%;background:rgba(0,0,0,.4);color:#fff;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:12px 14px;font-size:14px;outline:none;font-family:'JetBrains Mono',monospace}
input:focus{border-color:#FF5C00}
input::placeholder{color:#3F3F46}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#FF5C00,#FF3B30);color:#000;border:none;border-radius:10px;cursor:pointer;font-size:14px;font-weight:800;margin-top:16px;letter-spacing:.04em}
.btn:hover{opacity:.9}
.msg{padding:12px;border-radius:8px;font-size:13px;margin-top:14px;text-align:center;line-height:1.5}
.msg.ok{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.3);color:#86EFAC}
.msg.err{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);color:#FCA5A5}
a{color:#FF5C00;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <span>🔥</span>
    <h1>Reset Password</h1>
    <p>Enter your new password below</p>
  </div>

  <div id="formBox">
    <label>New Password</label>
    <input type="password" id="pw1" placeholder="Min 6 characters">
    <label>Confirm Password</label>
    <input type="password" id="pw2" placeholder="Confirm new password">
    <button class="btn" onclick="doReset()">Reset Password</button>
  </div>

  <div id="msgBox" class="msg" style="display:none"></div>

  <div style="text-align:center;margin-top:16px;font-size:12px;color:#52525B">
    <a href="/login">← Back to Login</a>
  </div>
</div>

<script>
const API = window.location.origin;

// Get token from URL
const params = new URLSearchParams(window.location.search);
const token = params.get("token");

if (!token) {
  document.getElementById("formBox").innerHTML = '<div class="msg err" style="display:block">Invalid reset link. No token found.<br><a href="/login">Go to Login →</a></div>';
}

async function doReset() {
  const pw1 = document.getElementById("pw1").value;
  const pw2 = document.getElementById("pw2").value;
  const msgBox = document.getElementById("msgBox");

  if (!pw1 || pw1.length < 6) {
    msgBox.className = "msg err"; msgBox.textContent = "Password must be at least 6 characters."; msgBox.style.display = "block";
    return;
  }
  if (pw1 !== pw2) {
    msgBox.className = "msg err"; msgBox.textContent = "Passwords don't match."; msgBox.style.display = "block";
    return;
  }

  try {
    const r = await fetch(API + "/api/auth/reset-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: token, new_password: pw1 })
    });
    const d = await r.json();
    if (r.ok) {
      msgBox.className = "msg ok";
      msgBox.innerHTML = "Password reset successfully! <a href='/login'>Login now →</a>";
      msgBox.style.display = "block";
      document.getElementById("formBox").style.display = "none";
    } else {
      msgBox.className = "msg err";
      msgBox.textContent = d.detail || d.message || "Reset failed. Try requesting a new link.";
      msgBox.style.display = "block";
    }
  } catch(e) {
    msgBox.className = "msg err"; msgBox.textContent = "Network error. Try again."; msgBox.style.display = "block";
  }
}

document.getElementById("pw2").addEventListener("keydown", e => { if (e.key === "Enter") doReset(); });
</script>
</body>
</html>
